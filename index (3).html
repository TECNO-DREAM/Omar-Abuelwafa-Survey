:root{--bg:#ffffff;--fg:#09090b;--mut:#71717a;--bd:#e4e4e7;--card:#fafafa;--inv:#09090b;--invfg:#ffffff;--hover:#f4f4f5}
.dark{--bg:#09090b;--fg:#fafafa;--mut:#a1a1aa;--bd:#27272a;--card:#0c0c0f;--inv:#fafafa;--invfg:#09090b;--hover:#18181b}
html,body{background:var(--bg);color:var(--fg);font-family:'Inter','IBM Plex Sans Arabic',-apple-system,'SF Pro Text',system-ui,sans-serif}
html[dir=rtl] body{font-family:'IBM Plex Sans Arabic','Inter',system-ui,sans-serif}
*{border-color:var(--bd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px}
.btn{border:1px solid var(--bd);padding:.45rem .8rem;border-radius:8px;font-size:.85rem;display:inline-flex;gap:.45rem;align-items:center;background:var(--bg);color:var(--fg);cursor:pointer;transition:background .15s;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn-p{background:var(--inv);color:var(--invfg);border-color:var(--inv)}
.btn-p:hover{background:var(--inv);opacity:.85}
.btn-i{padding:.4rem .55rem}
.inp{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:.55rem .75rem;font-size:.9rem}
.inp:focus{outline:none;border-color:var(--fg)}
.inp.bad{border-color:var(--fg);border-style:dashed}
.err{font-size:.78rem;border-inline-start:2px solid var(--fg);padding-inline-start:.5rem;margin-top:.4rem}
.mut{color:var(--mut)}
.tab{padding:.4rem .8rem;border-radius:8px;font-size:.85rem;color:var(--mut);cursor:pointer;border:1px solid transparent;white-space:nowrap}
.tab:hover{color:var(--fg);background:var(--hover)}
.tab.active{background:var(--inv);color:var(--invfg)}
.opt{display:flex;align-items:center;gap:.6rem;border:1px solid var(--bd);border-radius:8px;padding:.55rem .75rem;cursor:pointer;background:var(--bg);width:100%;text-align:start;font-size:.9rem}
.opt:hover{background:var(--hover)}
.opt.sel{background:var(--inv);color:var(--invfg);border-color:var(--inv)}
.dot{width:14px;height:14px;border-radius:50%;border:1.5px solid currentColor;display:inline-flex;align-items:center;justify-content:center;flex:none}
.opt.sel .dot::after{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.cl{position:absolute;inset-inline:0;top:calc(100% + 4px);max-height:240px;overflow:auto;background:var(--bg);border:1px solid var(--fg);border-radius:8px;z-index:30}
.cl button{display:block;width:100%;text-align:start;padding:.5rem .75rem;font-size:.88rem}
.cl button:hover{background:var(--hover)}
.star{font-size:1.5rem;cursor:pointer;color:var(--mut);background:none;border:0;padding:.1rem}
.star.on{color:var(--fg)}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{text-align:start;font-weight:600;color:var(--mut);padding:.6rem .75rem;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:.6rem .75rem;border-bottom:1px solid var(--bd);vertical-align:top}
tr:hover td{background:var(--hover)}
.badge{border:1px solid var(--bd);border-radius:999px;padding:.1rem .6rem;font-size:.72rem;color:var(--mut)}
.badge.solid{background:var(--inv);color:var(--invfg);border-color:var(--inv)}
.toast{background:var(--inv);color:var(--invfg);padding:.65rem 1rem;border-radius:8px;font-size:.85rem;box-shadow:0 8px 30px rgba(0,0,0,.35);animation:tin .2s ease}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--fg);animation:pl 1.6s infinite}
@keyframes pl{50%{opacity:.25}}
textarea.inp{resize:vertical;min-height:80px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:8px}
</style>
</head>

  user: null, demo: sessionStorage.getItem('fb_demo') === '1',
  schema: lsGet('fb_schema', null) || defaultSchema(),
  answers: {}, errors: {}, done: false,
  subs: [], q: '', cf: '', page: 1, perPage: 8
};
let FB = null;            // firebase handles when configured
let unsubSubs = null;
let charts = [];
const localCbs = new Set();

const t = k => (T[state.lang][k] ?? T.en[k] ?? k);
const L = o => (o && (o[state.lang] || o.en || o.ar)) || '';
const cName = c => CMAP[c] ? CMAP[c][state.lang] : c;
const loc = () => state.lang === 'ar' ? 'ar-EG' : 'en-US';
const nf = n => Number(n).toLocaleString(loc(), { maximumFractionDigits: 1 });
const fmtDate = ts => new Date(ts).toLocaleString(loc(), { dateStyle:'medium', timeStyle:'short' });
const normTxt = s => String(s || '').toLowerCase().normalize('NFKD').replace(/[\u064B-\u0652\u0670]/g, '').replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/[\u0300-\u036f]/g, '');

const isAdmin = () => !!(state.demo || (state.user && state.user.email && state.user.email.toLowerCase() === ADMIN_EMAIL && state.user.emailVerified));

function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  $('#toasts').appendChild(el); setTimeout(() => { el.style.opacity = 0; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 3000);
}

/* ============================================================
   ENCRYPTION (CryptoJS AES, passphrase-derived 256-bit key)
   ============================================================ */
const encrypt = obj => CryptoJS.AES.encrypt(JSON.stringify(obj), ENC_SECRET).toString();
const decrypt = enc => { const s = CryptoJS.AES.decrypt(enc, ENC_SECRET).toString(CryptoJS.enc.Utf8); if (!s) throw new Error('bad'); return JSON.parse(s); };

/* ============================================================
   DATA LAYER (Firestore with localStorage fallback)
   ============================================================ */
function ingest(raw) {
  state.subs = raw.slice().sort((a, b) => b.ts - a.ts).map(r => { let p = null; try { p = decrypt(r.enc); } catch {} return { id: r.id, ts: r.ts, enc: r.enc, p }; });
  refreshData();
}
function refreshData() {
  if (state.tab === 'analytics') render();
  else if (state.tab === 'submissions') updateTable();
}
const loadLocalSubs = () => lsGet('fb_subs', []);

async function initFirebase() {
  if (!FIREBASE_CONFIG.apiKey || !FIREBASE_CONFIG.projectId) return;
  try {
    const v = '10.14.1', base = `https://www.gstatic.com/firebasejs/${v}/`;
    const [appM, authM, fsM] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
    const app = appM.initializeApp(FIREBASE_CONFIG);
    FB = { auth: authM.getAuth(app), db: fsM.getFirestore(app), authM, fsM };
    authM.onAuthStateChanged(FB.auth, u => { state.user = u; syncAdmin(); render(); });
    fsM.onSnapshot(fsM.doc(FB.db, 'config', 'form'), snap => {
      if (snap.exists()) { try { state.schema = JSON.parse(snap.data().schema); } catch {} if (state.tab !== 'builder') render(); }
    }, () => {});
    state.demo = false; sessionStorage.removeItem('fb_demo');
    render();
  } catch (e) { console.warn('Firebase init failed, using localStorage', e); FB = null; toast(t('no_fb')); }
}

function syncAdmin() {
  if (isAdmin() && !unsubSubs) {
    if (FB) {
      const { collection, query, orderBy, onSnapshot } = FB.fsM;
      unsubSubs = onSnapshot(query(collection(FB.db, 'submissions'), orderBy('ts', 'desc')),
        snap => ingest(snap.docs.map(d => ({ id: d.id, ...d.data() }))), err => console.warn(err));
    } else {
      const cb = () => ingest(loadLocalSubs()); localCbs.add(cb); cb();
      unsubSubs = () => localCbs.delete(cb);
    }
  } else if (!isAdmin() && unsubSubs) { unsubSubs(); unsubSubs = null; state.subs = []; }
}
window.addEventListener('storage', e => { if (e.key === 'fb_subs') localCbs.forEach(f => f()); if (e.key === 'fb_schema' && !FB) { state.schema = lsGet('fb_schema', state.schema); if (state.tab !== 'builder') render(); } });

async function addSubmissions(records) {
  if (FB) { const { collection, addDoc } = FB.fsM; await Promise.all(records.map(r => addDoc(collection(FB.db, 'submissions'), r))); }
  else { const all = loadLocalSubs(); records.forEach(r => all.push({ id: 's' + uid(), ...r })); lsSet('fb_subs', all); localCbs.forEach(f => f()); }
}
async function clearSubmissions() {
  if (FB) { const { collection, getDocs, deleteDoc } = FB.fsM; const s = await getDocs(collection(FB.db, 'submissions')); await Promise.all(s.docs.map(d => deleteDoc(d.ref))); }
  else { lsSet('fb_subs', []); localCbs.forEach(f => f()); }
}
async function saveSchema() {
  if (FB) await FB.fsM.setDoc(FB.fsM.doc(FB.db, 'config', 'form'), { schema: JSON.stringify(state.schema), updated: Date.now() });
  else lsSet('fb_schema', state.schema);
}

/* ============================================================
   VIEWS
   ============================================================ */
function render() {
  const y = window.scrollY; destroyCharts();
  const h = document.documentElement;
  h.lang = state.lang; h.dir = state.lang === 'ar' ? 'rtl' : 'ltr'; h.classList.toggle('dark', state.theme === 'dark');
  document.title = t('app');
  if (!isAdmin() && state.tab !== 'form') state.tab = 'form';
  $('#app').innerHTML = headerHTML() + `<main class="max-w-6xl mx-auto px-4 py-8">${viewHTML()}</main>`;
  afterRender(); window.scrollTo(0, y);
}

function headerHTML() {
  const admin = isAdmin();
  const tabs = [['form','nav_form']].concat(admin ? [['builder','nav_builder'],['analytics','nav_analytics'],['submissions','nav_subs']] : []);
  const showDemo = !FB;
  return `<header class="sticky top-0 z-40 border-b" style="background:var(--bg)">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center gap-3">
      <div class="flex items-center gap-2 me-2"><span class="inline-flex w-7 h-7 items-center justify-center rounded-md" style="background:var(--inv);color:var(--invfg)"><i class="fa-solid fa-table-cells-large text-xs"></i></span><b class="tracking-tight">${t('app')}</b></div>
      <nav class="flex gap-1 overflow-x-auto flex-1 min-w-0">${tabs.map(([k, l]) => `<button class="tab ${state.tab === k ? 'active' : ''}" data-act="tab" data-v="${k}">${t(l)}</button>`).join('')}</nav>
      <div class="flex items-center gap-2 flex-wrap">
        <span class="badge ${admin ? 'solid' : ''}">${admin ? t('admin') : t('visitor')}</span>
        <span class="badge hidden sm:inline-flex items-center gap-1.5">${FB ? '<span class="pulse"></span>' : '<i class="fa-solid fa-hard-drive"></i>'} ${FB ? t('cloud_mode') : t('local_mode')}</span>
        ${showDemo ? `<button class="btn" data-act="demo" title="${t('demo')}"><i class="fa-solid ${state.demo ? 'fa-toggle-on' : 'fa-toggle-off'}"></i><span class="hidden md:inline">${t('demo')}</span></button>` : ''}
        ${state.user ? `<button class="btn" data-act="signout"><i class="fa-solid fa-right-from-bracket"></i><span class="hidden md:inline">${t('signout')}</span></button>`
                     : `<button class="btn btn-p" data-act="signin"><i class="fa-brands fa-google"></i><span>${t('signin')}</span></button>`}
        <button class="btn btn-i" data-act="lang" title="Language">${state.lang === 'en' ? 'العربية' : 'English'}</button>
        <button class="btn btn-i" data-act="theme" title="${state.theme === 'dark' ? t('light') : t('dark')}"><i class="fa-solid ${state.theme === 'dark' ? 'fa-sun' : 'fa-moon'}"></i></button>
      </div></div></header>`;
}

function viewHTML() {
  return ({ form: formView, builder: builderView, analytics: analyticsView, submissions: submissionsView }[state.tab] || formView)();
}

/* ---------- Public form ---------- */
function formView() {
  const s = state.schema;
  if (state.done) return `<div class="card max-w-xl mx-auto p-10 text-center"><i class="fa-solid fa-circle-check text-4xl mb-4"></i>
    <h2 class="text-xl font-semibold mb-1">${t('thanks')}</h2><p class="mut text-sm mb-6">${t('thanks_sub')}</p>
    <button class="btn btn-p" data-act="another">${t('another')}</button></div>`;
  return `<div class="max-w-xl mx-auto"><div class="mb-6"><h1 class="text-2xl font-semibold tracking-tight">${esc(L(s.title))}</h1><p class="mut text-sm mt-1">${esc(L(s.desc))}</p></div>
    <div class="card p-6 space-y-6">${s.fields.length ? s.fields.map(fieldHTML).join('') : `<p class="mut text-sm">${t('empty_form')}</p>`}
    ${s.fields.length ? `<div class="pt-2 flex items-center justify-between gap-3 flex-wrap"><span class="mut text-xs"><i class="fa-solid fa-lock me-1"></i>${t('encrypted_note')}</span>
    <button class="btn btn-p" data-act="submit"><i class="fa-solid fa-paper-plane"></i>${t('submit')}</button></div>` : ''}</div></div>`;
}

function fieldHTML(f) {
  const v = state.answers[f.id], err = state.errors[f.id]; let c = '';
  if (f.type === 'text') c = `<input class="inp ${err ? 'bad' : ''}" data-inp="ans" data-fid="${f.id}" value="${esc(v ?? '')}" placeholder="${esc(t('ph_text'))}">`;
  else if (f.type === 'number') c = `<input class="inp ${err ? 'bad' : ''}" type="number" step="any" data-inp="ans" data-fid="${f.id}" value="${esc(v ?? '')}" placeholder="${esc(t('ph_number'))}">`;
  else if (f.type === 'rating') c = `<div class="flex gap-1" dir="ltr">${[1,2,3,4,5].map(n => `<button type="button" class="star ${v >= n ? 'on' : ''}" data-act="rate" data-fid="${f.id}" data-v="${n}" aria-label="${n}"><i class="fa-${v >= n ? 'solid' : 'regular'} fa-star"></i></button>`).join('')}</div>`;
  else if (f.type === 'radio') c = `<div class="grid gap-2">${(f.options || []).map(o => `<button type="button" class="opt ${v === o.id ? 'sel' : ''}" data-act="pick" data-fid="${f.id}" data-v="${o.id}"><span class="dot"></span>${esc(L(o))}</button>`).join('')}</div>`;
  else if (f.type === 'country') c = `<div class="relative" data-cb="${f.id}"><input class="inp ${err ? 'bad' : ''}" data-inp="cq" data-fid="${f.id}" autocomplete="off" value="${esc(v ? cName(v) : '')}" placeholder="${esc(t('search_country'))}"><div class="cl hidden" id="cl-${f.id}"></div></div>`;
  return `<div><label class="block text-sm font-medium mb-2">${esc(L(f.label))}${f.required ? ' <span class="mut">*</span>' : ''}</label>${c}${err ? `<div class="err">${t(err)}</div>` : ''}</div>`;
}

function fillCountryList(fid, q) {
  const box = $('#cl-' + fid); if (!box) return;
  const n = normTxt(q);
  const list = COUNTRIES.filter(c => !n || normTxt(c.en).includes(n) || normTxt(c.ar).includes(n) || c.code.toLowerCase() === n)
    .sort((a, b) => a[state.lang].localeCompare(b[state.lang], state.lang));
  box.innerHTML = list.length ? list.map(c => `<button type="button" data-act="pickc" data-fid="${fid}" data-v="${c.code}">${esc(c[state.lang])} <span class="mut text-xs">· ${esc(state.lang === 'ar' ? c.en : c.ar)}</span></button>`).join('')
    : `<div class="p-3 text-sm mut">${t('no_results')}</div>`;
  box.classList.remove('hidden');
}

function validate() {
  const errs = {};
  state.schema.fields.forEach(f => {
    const v = state.answers[f.id], empty = v === undefined || v === null || v === '';
    if (f.required && empty) errs[f.id] = 'err_required';
    else if (f.type === 'number' && !empty && !Number.isFinite(Number(v))) errs[f.id] = 'err_number';
  });
  state.errors = errs; return !Object.keys(errs).length;
}

async function submitForm() {
  if (!validate()) { render(); const e = $('.err'); if (e) e.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
  try {
    const payload = { answers: state.answers, lang: state.lang };
    await addSubmissions([{ ts: Date.now(), enc: encrypt(payload), v: 1 }]);
    state.answers = {}; state.errors = {}; state.done = true; toast(t('s_ok')); render();
  } catch (e) { console.error(e); toast(t('s_fail')); }
}

  const types = [['text','ft_text','fa-font'],['number','ft_number','fa-hashtag'],['rating','ft_rating','fa-star'],['radio','ft_radio','fa-list-ul'],['country','ft_country','fa-earth-africa']];
  return `<div class="max-w-3xl mx-auto">
    <div class="flex items-start justify-between gap-3 flex-wrap mb-6"><div><h1 class="text-2xl font-semibold tracking-tight">${t('builder_h')}</h1><p class="mut text-sm mt-1">${t('builder_s')}</p></div>
      <div class="flex gap-2"><button class="btn" data-act="resetForm"><i class="fa-solid fa-rotate-left"></i>${t('reset')}</button><button class="btn btn-p" data-act="saveForm"><i class="fa-solid fa-floppy-disk"></i>${t('save_form')}</button></div></div>
    <div class="card p-5 mb-4 grid sm:grid-cols-2 gap-3">

      <div><label class="text-xs mut block mb-1">${t('title_lbl')} · AR</label><input class="inp" dir="rtl" data-inp="meta" data-w="title" data-k="ar" value="${esc(s.title.ar)}"></div>
      <div><label class="text-xs mut block mb-1">${t('desc_lbl')} · EN</label><input class="inp" dir="ltr" data-inp="meta" data-w="desc" data-k="en" value="${esc(s.desc.en)}"></div>
      <div><label class="text-xs mut block mb-1">${t('desc_lbl')} · AR</label><input class="inp" dir="rtl" data-inp="meta" data-w="desc" data-k="ar" value="${esc(s.desc.ar)}"></div></div>
    <div class="space-y-3">${s.fields.map((f, i) => `<div class="card p-4">
      <div class="flex items-center justify-between gap-2 mb-3 flex-wrap">
        <span class="badge solid"><i class="fa-solid ${(types.find(x => x[0] === f.type) || [])[2]} me-1"></i>${t((types.find(x => x[0] === f.type) || [])[1])}</span>
        <div class="flex items-center gap-1">
          <label class="flex items-center gap-2 text-xs me-2 cursor-pointer"><input type="checkbox" data-inp="freq" data-fid="${f.id}" ${f.required ? 'checked' : ''} style="accent-color:var(--fg)">${t('required')}</label>
          <button class="btn btn-i" data-act="mv" data-i="${i}" data-v="-1" ${i === 0 ? 'disabled style="opacity:.35"' : ''} title="${t('up')}"><i class="fa-solid fa-arrow-up"></i></button>
          <button class="btn btn-i" data-act="mv" data-i="${i}" data-v="1" ${i === s.fields.length - 1 ? 'disabled style="opacity:.35"' : ''} title="${t('down')}"><i class="fa-solid fa-arrow-down"></i></button>
          <button class="btn btn-i" data-act="rm" data-i="${i}" title="${t('del')}"><i class="fa-solid fa-trash"></i></button></div></div>
      <div class="grid sm:grid-cols-2 gap-3">
        <div><label class="text-xs mut block mb-1">${t('label_en')}</label><input class="inp" dir="ltr" data-inp="flabel" data-fid="${f.id}" data-k="en" value="${esc(f.label.en)}"></div>
        <div><label class="text-xs mut block mb-1">${t('label_ar')}</label><input class="inp" dir="rtl" data-inp="flabel" data-fid="${f.id}" data-k="ar" value="${esc(f.label.ar)}"></div></div>
      ${f.type === 'radio' ? `<div class="mt-3"><label class="text-xs mut block mb-1">${t('options_hint')}</label><textarea class="inp" data-inp="fopts" data-fid="${f.id}">${esc((f.options || []).map(o => o.en + ' | ' + o.ar).join('\n'))}</textarea></div>` : ''}
    </div>`).join('')}</div>
    <div class="card p-4 mt-4"><div class="text-xs mut mb-2">${t('add_field')}</div><div class="flex flex-wrap gap-2">${types.map(([k, l, ic]) => `<button class="btn" data-act="add" data-v="${k}"><i class="fa-solid ${ic}"></i>${t(l)}</button>`).join('')}</div></div></div>`;
}

function addField(type) {
  const f = { id: uid(), type, required: false, label: { en: T.en.new_label, ar: T.ar.new_label } };
  if (type === 'radio') f.options = [{ id:'o1', en:T.en.opt_a, ar:T.ar.opt_a }, { id:'o2', en:T.en.opt_b, ar:T.ar.opt_b }];
  state.schema.fields.push(f); render();
}

/* ---------- Analytics ---------- */
function palette() { return state.theme === 'dark' ? ['#fafafa','#d4d4d8','#a1a1aa','#71717a','#52525b','#3f3f46'] : ['#09090b','#27272a','#52525b','#71717a','#a1a1aa','#d4d4d8']; }
const dayKey = d => { const x = new Date(d); return x.getFullYear() + '-' + x.getMonth() + '-' + x.getDate(); };
const answered = v => v !== undefined && v !== null && v !== '';

function stats() {
  const rows = state.subs.filter(s => s.p), F = state.schema.fields;
  const rf = F.filter(f => f.type === 'rating'), cf = F.filter(f => f.type === 'country');
  const ratings = [0, 0, 0, 0, 0], countries = {}; let rsum = 0, rn = 0, comp = 0;
  rows.forEach(s => {
    const a = s.p.answers || {};
    rf.forEach(f => { const v = Number(a[f.id]); if (v >= 1 && v <= 5) { ratings[v - 1]++; rsum += v; rn++; } });
    cf.forEach(f => { if (a[f.id]) countries[a[f.id]] = (countries[a[f.id]] || 0) + 1; });
    comp += F.length ? F.filter(f => answered(a[f.id])).length / F.length : 1;
  });
  const topC = Object.entries(countries).sort((a, b) => b[1] - a[1]);
  const days = [], now = new Date(); now.setHours(0, 0, 0, 0);
  for (let i = 13; i >= 0; i--) { const d = new Date(now); d.setDate(d.getDate() - i); days.push(d); }
  const byDay = {}; rows.forEach(s => { const k = dayKey(s.ts); byDay[k] = (byDay[k] || 0) + 1; });
  return { total: rows.length, avg: rn ? rsum / rn : null, comp: rows.length ? comp / rows.length * 100 : null, topC, ratings, rn,
    trendLabels: days.map(d => d.toLocaleDateString(loc(), { month: 'short', day: 'numeric' })), trend: days.map(d => byDay[dayKey(d)] || 0) };
}

function analyticsView() {
  const s = stats();
  const kpi = (ic, lbl, val) => `<div class="card p-5"><div class="flex items-center justify-between mb-3"><span class="mut text-xs">${lbl}</span><i class="fa-solid ${ic} mut text-sm"></i></div><div class="text-2xl font-semibold tracking-tight">${val}</div></div>`;
  return `<div><div class="flex items-start justify-between gap-3 flex-wrap mb-6">
    <div><h1 class="text-2xl font-semibold tracking-tight flex items-center gap-3">${t('analytics_h')}<span class="badge inline-flex items-center gap-1.5"><span class="pulse"></span>${t('live')}</span></h1></div>
    <div class="flex gap-2"><button class="btn" data-act="sample"><i class="fa-solid fa-wand-magic-sparkles"></i>${t('load_sample')}</button><button class="btn" data-act="clear"><i class="fa-solid fa-trash"></i>${t('clear')}</button></div></div>
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-4">
      ${kpi('fa-inbox', t('kpi_total'), nf(s.total))}
      ${kpi('fa-star', t('kpi_avg'), s.avg == null ? t('na') : nf(s.avg) + ' / ' + nf(5))}
      ${kpi('fa-circle-check', t('kpi_comp'), s.comp == null ? t('na') : nf(s.comp) + '%')}
      ${kpi('fa-earth-africa', t('kpi_top'), s.topC.length ? esc(cName(s.topC[0][0])) : t('na'))}</div>
    <div class="grid lg:grid-cols-3 gap-3">
      <div class="card p-5 lg:col-span-2"><div class="text-sm font-medium mb-4">${t('ch_trend')}</div><div style="height:260px"><canvas id="c-trend"></canvas></div></div>
      <div class="card p-5"><div class="text-sm font-medium mb-4">${t('ch_rating')}</div>${s.rn ? '<div style="height:260px"><canvas id="c-rate"></canvas></div>' : `<p class="mut text-sm py-16 text-center">${t('na')}</p>`}</div>
      <div class="card p-5 lg:col-span-3"><div class="text-sm font-medium mb-4">${t('ch_country')}</div>${s.topC.length ? '<div style="height:280px"><canvas id="c-ctry"></canvas></div>' : `<p class="mut text-sm py-16 text-center">${t('na')}</p>`}</div></div></div>`;
}

function destroyCharts() { charts.forEach(c => c.destroy()); charts = []; }
function mkCharts() {
  if (typeof Chart === 'undefined') return;
  const s = stats(), pal = palette(), cs = getComputedStyle(document.documentElement);
  const fg = cs.getPropertyValue('--fg').trim(), mut = cs.getPropertyValue('--mut').trim(), bd = cs.getPropertyValue('--bd').trim(), bg = cs.getPropertyValue('--bg').trim();
  const rtl = state.lang === 'ar';
  Chart.defaults.color = mut; Chart.defaults.font.family = rtl ? "'IBM Plex Sans Arabic',sans-serif" : "'Inter',sans-serif";
  const common = { responsive: true, maintainAspectRatio: false, plugins: { tooltip: { rtl, textDirection: rtl ? 'rtl' : 'ltr', backgroundColor: fg, titleColor: bg, bodyColor: bg } } };
  const a = $('#c-trend');
  if (a) charts.push(new Chart(a, { type: 'bar', data: { labels: s.trendLabels, datasets: [{ label: t('ch_subs'), data: s.trend, backgroundColor: pal[0], borderRadius: 4, maxBarThickness: 28 }] },
    options: { ...common, plugins: { ...common.plugins, legend: { display: false } }, scales: { x: { grid: { display: false }, border: { color: bd }, reverse: rtl }, y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: bd }, border: { display: false }, position: rtl ? 'right' : 'left' } } } }));
  const b = $('#c-rate');
  if (b) charts.push(new Chart(b, { type: 'doughnut', data: { labels: [1,2,3,4,5].map(n => '★ ' + nf(n)), datasets: [{ data: s.ratings, backgroundColor: pal.slice(0, 5), borderColor: bg, borderWidth: 2 }] },
    options: { ...common, cutout: '62%', plugins: { ...common.plugins, legend: { position: 'bottom', rtl, labels: { boxWidth: 10, boxHeight: 10, usePointStyle: true } } } } }));
  const c = $('#c-ctry');
  if (c) { const top = s.topC.slice(0, 6);
    charts.push(new Chart(c, { type: 'doughnut', data: { labels: top.map(x => cName(x[0])), datasets: [{ data: top.map(x => x[1]), backgroundColor: pal, borderColor: bg, borderWidth: 2 }] },
      options: { ...common, cutout: '62%', plugins: { ...common.plugins, legend: { position: rtl ? 'left' : 'right', rtl, labels: { boxWidth: 10, boxHeight: 10, usePointStyle: true } } } } })); }
}

/* ---------- Submissions table ---------- */
function cellText(f, v) {
  if (!answered(v)) return '';
  if (f.type === 'rating') return '★'.repeat(Number(v)) + '☆'.repeat(5 - Number(v));
  if (f.type === 'country') return cName(v);
  if (f.type === 'radio') { const o = (f.options || []).find(o => o.id === v); return o ? L(o) : v; }
  return String(v);
}
function filteredSubs() {
  const q = normTxt(state.q), F = state.schema.fields;
  return state.subs.filter(s => {
    if (state.cf) { if (!s.p) return false; if (!F.some(f => f.type === 'country' && s.p.answers[f.id] === state.cf)) return false; }
    if (!q) return true; if (!s.p) return false;
    return F.map(f => cellText(f, s.p.answers[f.id])).concat(F.filter(f => f.type === 'country').map(f => CMAP[s.p.answers[f.id]] ? CMAP[s.p.answers[f.id]].en + ' ' + CMAP[s.p.answers[f.id]].ar : '')).some(x => normTxt(x).includes(q));
  });
}
function submissionsView() {
  const present = [...new Set(state.subs.flatMap(s => s.p ? state.schema.fields.filter(f => f.type === 'country').map(f => s.p.answers[f.id]).filter(Boolean) : []))].sort((a, b) => cName(a).localeCompare(cName(b), state.lang));
  return `<div><div class="flex items-start justify-between gap-3 flex-wrap mb-6"><h1 class="text-2xl font-semibold tracking-tight flex items-center gap-3">${t('subs_h')}<span class="badge inline-flex items-center gap-1.5"><span class="pulse"></span>${t('live')}</span></h1>
    <div class="flex gap-2 flex-wrap items-center"><span class="mut text-xs"><i class="fa-solid fa-download me-1"></i>${t('export')}</span>
      <button class="btn" data-act="exp" data-v="csv">${t('csv')}</button><button class="btn" data-act="exp" data-v="csvE"><i class="fa-solid fa-lock text-xs"></i>${t('csv_enc')}</button>
      <button class="btn" data-act="exp" data-v="json">${t('json')}</button><button class="btn" data-act="exp" data-v="jsonE"><i class="fa-solid fa-lock text-xs"></i>${t('json_enc')}</button></div></div>
    <div class="flex gap-2 mb-3 flex-wrap"><div class="relative flex-1 min-w-[200px]"><i class="fa-solid fa-magnifying-glass absolute top-1/2 -translate-y-1/2 mut text-sm" style="inset-inline-start:.8rem"></i><input class="inp" style="padding-inline-start:2.2rem" data-inp="q" value="${esc(state.q)}" placeholder="${esc(t('search'))}"></div>
      <select class="inp" style="width:auto;min-width:180px" data-inp="cf"><option value="">${t('all_countries')}</option>${present.map(c => `<option value="${c}" ${state.cf === c ? 'selected' : ''}>${esc(cName(c))}</option>`).join('')}</select></div>
    <div class="card overflow-hidden" id="tbl">${tableHTML()}</div></div>`;
}
function tableHTML() {
  const F = state.schema.fields, rows = filteredSubs(), pages = Math.max(1, Math.ceil(rows.length / state.perPage));
  if (state.page > pages) state.page = pages;
  const slice = rows.slice((state.page - 1) * state.perPage, state.page * state.perPage);
  if (!state.subs.length) return `<p class="mut text-sm p-10 text-center">${t('empty')}</p>`;
  return `<div class="overflow-x-auto"><table><thead><tr><th>${t('date')}</th>${F.map(f => `<th>${esc(L(f.label))}</th>`).join('')}</tr></thead><tbody>
    ${slice.length ? slice.map(s => `<tr><td class="whitespace-nowrap mut">${esc(fmtDate(s.ts))}</td>${s.p ? F.map(f => `<td>${esc(cellText(f, s.p.answers[f.id]))}</td>`).join('') : `<td colspan="${F.length}" class="mut"><i class="fa-solid fa-lock me-1"></i>${t('undecryptable')}</td>`}</tr>`).join('')
      : `<tr><td colspan="${F.length + 1}" class="mut text-center py-8">${t('no_match')}</td></tr>`}</tbody></table></div>
    <div class="flex items-center justify-between gap-3 p-3 border-t text-sm flex-wrap"><span class="mut">${nf(rows.length)} ${t('rows')} · ${t('page')} ${nf(state.page)} ${t('of')} ${nf(pages)}</span>
      <div class="flex gap-2"><button class="btn" data-act="pg" data-v="-1" ${state.page <= 1 ? 'disabled style="opacity:.35"' : ''}>${t('prev')}</button><button class="btn" data-act="pg" data-v="1" ${state.page >= pages ? 'disabled style="opacity:.35"' : ''}>${t('next')}</button></div></div>`;
}
function updateTable() { const el = $('#tbl'); if (el) el.innerHTML = tableHTML(); }

/* ---------- Export ---------- */
function download(name, text, mime) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: mime })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function exportData(kind) {
  const F = state.schema.fields, rows = filteredSubs(), stamp = new Date().toISOString().slice(0, 10);
  const csvCell = v => '"' + String(v ?? '').replace(/"/g, '""').replace(/^([=+\-@])/, "'$1") + '"';
  if (kind === 'csv') {
    const head = ['id', 'timestamp'].concat(F.map(f => L(f.label)));
    const lines = rows.filter(r => r.p).map(r => [r.id, new Date(r.ts).toISOString()].concat(F.map(f => cellText(f, r.p.answers[f.id]))).map(csvCell).join(','));
    download(`submissions-${stamp}.csv`, '\uFEFF' + [head.map(csvCell).join(',')].concat(lines).join('\r\n'), 'text/csv;charset=utf-8');
  } else if (kind === 'csvE') {
    download(`submissions-encrypted-${stamp}.csv`, '\uFEFF' + [['id', 'timestamp', 'ciphertext'].map(csvCell).join(',')].concat(rows.map(r => [r.id, new Date(r.ts).toISOString(), r.enc].map(csvCell).join(','))).join('\r\n'), 'text/csv;charset=utf-8');
  } else if (kind === 'json') {
    download(`submissions-${stamp}.json`, JSON.stringify({ form: state.schema, submissions: rows.filter(r => r.p).map(r => ({ id: r.id, timestamp: new Date(r.ts).toISOString(), lang: r.p.lang, answers: r.p.answers })) }, null, 2), 'application/json');
  } else {
    download(`submissions-encrypted-${stamp}.json`, JSON.stringify(rows.map(r => ({ id: r.id, ts: r.ts, enc: r.enc })), null, 2), 'application/json');
  }
  toast(t('exported'));
}

/* ---------- Sample data ---------- */
async function loadSample() {
  const names = ['Layla Hassan','John Carter','Mariam Saleh','Chen Wei','Sofia Rossi','Omar Farouk','Aisha Khan','Lucas Silva','Nour Haddad','Emma Müller','Yusuf Demir','Amina Diallo'];
  const notes = ['Great experience overall.','Support was quick and helpful.','Could be faster.','Love the new design.','Pricing could be clearer.','Would recommend to friends.',''];
  const cc = ['EG','EG','SA','AE','US','GB','DE','FR','IN','BR','JP','TR','MA','JO','NG','CA'];
  const pick = a => a[Math.floor(Math.random() * a.length)], recs = [];
  for (let i = 0; i < 40; i++) {
    const a = {};
    state.schema.fields.forEach(f => {
      if (f.type === 'text') a[f.id] = /name|اسم/i.test(f.label.en + f.label.ar) ? pick(names) : pick(notes);
      else if (f.type === 'number') a[f.id] = 18 + Math.floor(Math.random() * 47);
      else if (f.type === 'rating') a[f.id] = pick([3, 4, 4, 4, 5, 5, 5, 2, 1]);
      else if (f.type === 'radio') a[f.id] = pick(f.options || [{ id: 'o1' }]).id;
      else if (f.type === 'country') a[f.id] = pick(cc);
    });
    recs.push({ ts: Date.now() - Math.floor(Math.random() * 14 * 864e5), enc: encrypt({ answers: a, lang: pick(['en', 'ar']) }), v: 1 });
  }
  await addSubmissions(recs); toast(t('sample_ok'));
}

/* ============================================================
   EVENTS
   ============================================================ */
const actions = {
  tab: d => { state.tab = d.v; state.page = 1; render(); },
  lang: () => { state.lang = state.lang === 'en' ? 'ar' : 'en'; lsSet('fb_lang', state.lang); render(); },
  theme: () => { state.theme = state.theme === 'dark' ? 'light' : 'dark'; lsSet('fb_theme', state.theme); render(); },
  demo: () => { state.demo = !state.demo; state.demo ? sessionStorage.setItem('fb_demo', '1') : sessionStorage.removeItem('fb_demo'); syncAdmin(); toast(t(state.demo ? 'demo_on' : 'demo_off')); render(); },
  signin: async () => {
    if (!FB) { toast(t('no_fb')); return; }
    try { const { GoogleAuthProvider, signInWithPopup } = FB.authM; const r = await signInWithPopup(FB.auth, new GoogleAuthProvider()); toast(t(r.user.email && r.user.email.toLowerCase() === ADMIN_EMAIL ? 's_in_admin' : 's_in_user')); }
    catch (e) { console.warn(e); toast(t('sign_fail')); }
  },
  signout: async () => { if (FB && state.user) await FB.authM.signOut(FB.auth); state.user = null; state.demo = false; sessionStorage.removeItem('fb_demo'); syncAdmin(); toast(t('s_out')); render(); },
  rate: d => { state.answers[d.fid] = Number(d.v); delete state.errors[d.fid]; render(); },
  pick: d => { state.answers[d.fid] = d.v; delete state.errors[d.fid]; render(); },
  pickc: d => { state.answers[d.fid] = d.v; delete state.errors[d.fid]; render(); },
  submit: submitForm,
  another: () => { state.done = false; render(); },
  add: d => addField(d.v),
  rm: d => { state.schema.fields.splice(Number(d.i), 1); render(); },
  mv: d => { const i = Number(d.i), j = i + Number(d.v), F = state.schema.fields; if (j < 0 || j >= F.length) return; [F[i], F[j]] = [F[j], F[i]]; render(); },
  saveForm: async () => { try { await saveSchema(); toast(t('saved')); } catch (e) { console.error(e); toast(t('s_fail')); } },
  resetForm: () => { state.schema = defaultSchema(); render(); toast(t('reset_ok')); },
  sample: async () => { try { await loadSample(); } catch (e) { console.error(e); toast(t('s_fail')); } },
  clear: async () => { if (!confirm(t('confirm_clear'))) return; try { await clearSubmissions(); toast(t('cleared')); } catch (e) { console.error(e); toast(t('s_fail')); } },
  pg: d => { state.page += Number(d.v); updateTable(); },
  exp: d => exportData(d.v)
};
const inputs = {
  ans: el => { state.answers[el.dataset.fid] = el.value; if (state.errors[el.dataset.fid]) { delete state.errors[el.dataset.fid]; el.classList.remove('bad'); const e = el.parentElement.querySelector('.err'); if (e) e.remove(); } },
  cq: el => { const fid = el.dataset.fid; delete state.answers[fid]; fillCountryList(fid, el.value); },
  meta: el => { state.schema[el.dataset.w][el.dataset.k] = el.value; },
  flabel: el => { const f = state.schema.fields.find(x => x.id === el.dataset.fid); if (f) f.label[el.dataset.k] = el.value; },
  freq: el => { const f = state.schema.fields.find(x => x.id === el.dataset.fid); if (f) f.required = el.checked; },
  fopts: el => { const f = state.schema.fields.find(x => x.id === el.dataset.fid); if (!f) return;
    f.options = el.value.split('\n').map(l => l.trim()).filter(Boolean).map((l, i) => { const [en, ar] = l.split('|').map(x => x.trim()); return { id: 'o' + (i + 1), en: en || ar || '', ar: ar || en || '' }; }); },
  q: el => { state.q = el.value; state.page = 1; updateTable(); },
  cf: el => { state.cf = el.value; state.page = 1; updateTable(); }
};
const app = $('#app');
app.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && !b.disabled) actions[b.dataset.act]?.(b.dataset, e); });
app.addEventListener('input', e => { const el = e.target; if (el.dataset.inp) inputs[el.dataset.inp]?.(el, e); });
app.addEventListener('focusin', e => { const el = e.target; if (el.dataset && el.dataset.inp === 'cq') { fillCountryList(el.dataset.fid, ''); el.select(); } });
document.addEventListener('click', e => { if (!e.target.closest('[data-cb]')) document.querySelectorAll('.cl').forEach(x => x.classList.add('hidden')); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.cl').forEach(x => x.classList.add('hidden')); });

function afterRender() { if (state.tab === 'analytics') mkCharts(); }

/* ============================================================
   BOOT
   ============================================================ */
syncAdmin();
render();
initFirebase().then(() => syncAdmin());
</script>
